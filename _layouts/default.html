<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% if page.title %}{{ page.title }} - {% endif %}CivicData SA</title>
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Source+Serif+4:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a href="{{ site.baseurl }}/" class="logo">
        <span class="logo-civic">CivicData</span><span class="logo-sa"> SA</span>
      </a>
      <nav class="site-nav">
        <a href="{{ site.baseurl }}/" class="nav-link {% if page.url == '/' %}active{% endif %}">Home</a>
        <a href="{{ site.baseurl }}/analyses/" class="nav-link {% if page.url contains 'analyses' %}active{% endif %}">Analyses</a>
        <a href="{{ site.baseurl }}/search/" class="nav-link {% if page.url contains 'search' %}active{% endif %}">Search</a>
        <a href="{{ site.baseurl }}/about/" class="nav-link {% if page.url contains 'about' %}active{% endif %}">About</a>
      </nav>
      <button class="nav-toggle" aria-label="Toggle menu">&#9776;</button>
    </div>
  </header>

  <main>
    {{ content }}
  </main>

  {% include footer.html %}

  <script src="{{ site.baseurl }}/assets/js/main.js"></script>
  {% if page.extra_js %}<script src="{{ site.baseurl }}/assets/js/{{ page.extra_js }}"></script>{% endif %}
</body>
</html>
