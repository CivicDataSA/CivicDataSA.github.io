<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Q2 Inspection Recency by District</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  html,body{margin:0;padding:0;font-family:'Helvetica Neue',Arial,sans-serif;background:#fff;}
  .chart-wrap{padding:16px 14px 10px;}
  .bar-row{display:grid;grid-template-columns:88px 1fr 50px;align-items:center;gap:8px;margin-bottom:9px;font-size:13px;}
  .bar-label{color:#1b2430;font-weight:600;}
  .bar-track{background:#eee9dd;border-radius:3px;height:18px;position:relative;overflow:hidden;}
  .bar-fill{height:100%;border-radius:3px 0 0 3px;}
  .bar-val{text-align:right;color:#888;font-variant-numeric:tabular-nums;font-size:12.5px;}
  .bar-row.highlight .bar-label{color:#C8102E;}
</style>
</head>
<body>
<div class="chart-wrap" id="chart"></div>
<script>
const DATA = [{"district": "2", "avg": 281.489362}, {"district": "5", "avg": 260.0}, {"district": "3", "avg": 257.933333}, {"district": "7", "avg": 249.428571}, {"district": "1", "avg": 247.338235}];
const maxAvg = Math.max(...DATA.map(r => r.avg));
const html = DATA.map(r => {
  const pct = (r.avg / maxAvg) * 100;
  const isD2 = r.district === '2';
  const fill = isD2 ? '#C8102E' : '#00558C';
  return `
    <div class="bar-row ${isD2 ? 'highlight' : ''}">
      <div class="bar-label">District ${r.district}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${fill}"></div></div>
      <div class="bar-val">${Math.round(r.avg)}d</div>
    </div>`;
}).join('');
document.getElementById('chart').innerHTML = html;
</script>
</body>
</html>
