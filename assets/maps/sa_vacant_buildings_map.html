const map = L.map('map', { scrollWheelZoom: false }).setView([29.4241, -98.4936], 11);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap &copy; CARTO',
  subdomains: 'abcd', maxZoom: 19
}).addTo(map);

const SWEEP_ADDRS = new Set([
  '618 Lamar','621 Burnet St','525 Nolan St','533 Nolan St','709 Hays St',
  '609 Nolan St','1002 Nolan St','917 Nolan St','210 Muncey','818 Lamar',
  '1019 Nolan St','1817 E Houston St','717 Burleson','1322 Hays St',
  '612 Sherman','405 Hays St','1005 N Cherry'
]);

function daysColor(d){
  if (d <= 90)  return '#3d7aa8';
  if (d <= 180) return '#00558C';
  if (d <= 270) return '#8a6d3b';
  if (d <= 365) return '#c8102e';
  return '#7a0c1f';
}
function daysLegend(){
  return [['≤ 90 days','#3d7aa8'],['91–180 days','#00558C'],['181–270 days','#8a6d3b'],['271–365 days','#c8102e'],['> 365 days','#7a0c1f']];
}
function sviColor(s){
  if (s < 0.25) return '#3d7aa8';
  if (s < 0.50) return '#00558C';
  if (s < 0.75) return '#8a6d3b';
  return '#c8102e';
}
function sviLegend(){
  return [['0.00–0.25 (low)','#3d7aa8'],['0.25–0.50','#00558C'],['0.50–0.75','#8a6d3b'],['0.75–1.00 (high)','#c8102e']];
}

let mode = 'days';
let markers = [];

function renderLegend(){
  const items = mode === 'days' ? daysLegend() : sviLegend();
  let html = items.map(([label,color]) =>
    `<span class="swatchrow"><span class="swatch" style="background:${color}"></span>${label}</span>`
  ).join('');
  html += `<span class="sweep-badge">● Aug 2025 sweep cluster</span>`;
  document.getElementById('legend').innerHTML = html;
}

function renderMarkers(){
  markers.forEach(m => map.removeLayer(m));
  markers = [];
  POINTS.forEach(p => {
    const isSweep = SWEEP_ADDRS.has(p.addr);
    const color = mode === 'days' ? daysColor(p.days) : sviColor(p.svi);
    const marker = L.circleMarker([p.lat, p.lon], {
      radius: isSweep ? 6 : 4,
      fillColor: color,
      fillOpacity: isSweep ? 0.95 : 0.75,
      color: isSweep ? '#C8102E' : '#ffffff',
      weight: isSweep ? 2 : 0.6,
    }).addTo(map);
    marker.bindPopup(
      `<b>${p.addr}</b>` +
      `District ${p.district} · ${p.status}<br>` +
      `SVI: ${p.svi.toFixed(2)} (${p.quartile.replace('_',' ')})<br>` +
      `${p.days} days since last inspection` +
      (isSweep ? `<br><span style="color:#C8102E;font-weight:700;">Part of Aug 2025 sweep cluster</span>` : '')
    );
    markers.push(marker);
  });
  renderLegend();
}

document.querySelectorAll('#colorToggle button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#colorToggle button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    mode = btn.dataset.mode;
    renderMarkers();
  });
});

renderMarkers();
